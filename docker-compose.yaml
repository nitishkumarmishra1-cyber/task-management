version: '3.8'

services:
  mongodb:
      image: mongo:7
      ports:
        - "27017:27017"
      volumes:
        - mongo-data:/data/db
      restart: unless-stopped

  server:
    image: server:01
    build:
      context: ./server
      dockerfile: DockerFile.dev
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env.docker
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
    restart: unless-stopped
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: DockerFile.dev
    ports:
      - "4200:4200"
    volumes:
      - ./client:/app/client
      - /app/client/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - server

volumes:
  mongo-data: