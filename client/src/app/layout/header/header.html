<mat-toolbar color="primary" class="app-header mat-elevation-z4">
    <div class="header-container">
        <div class="brand">
            <mat-icon class="logo-icon">assignment_turned_in</mat-icon>
            <span>TaskHub</span>
        </div>

        <div class="actions">
            <button mat-icon-button matTooltip="Notifications">
                <mat-icon matBadge="15">notifications</mat-icon>
            </button>

            <!-- Clicking this opens the profile dropdown (matMenuTriggerFor) -->
            <button mat-icon-button matTooltip="Account Profile" [matMenuTriggerFor]="profileMenu">
                <mat-icon>account_circle</mat-icon>
            </button>

            <!-- Dropdown panel content - hidden until the button above is clicked -->
            <mat-menu #profileMenu="matMenu" class="profile-menu-panel">
                <div class="menu-user-info">
                    <span class="menu-username">{{ currentUsername }}</span>
                    <span class="menu-role">{{ currentUserRole }}</span>
                </div>
                <mat-divider></mat-divider>
                <button mat-menu-item (click)="onLogout()">
                    <mat-icon>logout</mat-icon>
                    <span>Logout</span>
                </button>
            </mat-menu>
        </div>
    </div>
</mat-toolbar>
