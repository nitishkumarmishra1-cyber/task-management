<table mat-table [dataSource]="data" class="mat-elevation-z2 w-100">
        <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef> Title </th>
            <td mat-cell *matCellDef="let task" class="fw-bold"> {{task.title}} </td>
        </ng-container>

        <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef> Description </th>
            <td mat-cell *matCellDef="let task" class="text-truncate-cell"> {{task.description}} </td>
        </ng-container>

        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef> Status </th>
            <td mat-cell *matCellDef="let task">
                <span class="status-badge" [ngClass]="task.status">
                    {{ task.status === 'pending' ? 'Pending' : 'Completed' }}
                </span>
            </td>
        </ng-container>

        <ng-container matColumnDef="assignedTo">
            <th mat-header-cell *matHeaderCellDef> Assignee </th>
            <td mat-cell *matCellDef="let task"> {{ task.assignName }} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="text-end"> Actions </th>
            <td mat-cell *matCellDef="let task" class="text-end">
                @for(option of options; track option.id) {
                <button mat-icon-button color="accent" (click)="option.listener(task)">
                    <mat-icon>{{option.name}}</mat-icon>
                </button>
                }
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns;"></tr>
    </table>
